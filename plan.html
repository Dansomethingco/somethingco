<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startup idea check | something.co</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Zilla+Slab:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F8F6EE;--cream-2:#EEEBDC;--line:#D6D2BF;--ink:#1E1D1A;--soft:#55524A;--slab:'Zilla Slab','Rockwell',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font:17px/1.65 var(--sans)}
a{color:inherit}:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center;height:72px}
.logo{font:500 1.5rem var(--slab);text-decoration:none}
h1,h2,h3{font-family:var(--slab);font-weight:500;line-height:1.12}
h1{font-size:clamp(2.2rem,6vw,3.4rem);margin:64px 0 18px}
h2{font-size:1.6rem;margin:36px 0 10px}h3{font-size:1.25rem}
p{color:var(--soft)}
label{display:block;font-weight:700;margin:28px 0 8px}
input[type=text]{width:100%;max-width:320px;padding:12px 14px;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:2px}
textarea{width:100%;min-height:200px;padding:14px;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:2px;resize:vertical}
.btn{display:inline-block;margin-top:18px;padding:14px 24px;border:2px solid var(--ink);background:var(--ink);color:var(--cream);font:700 1rem var(--sans);cursor:pointer;border-radius:2px}
.btn:hover{background:transparent;color:var(--ink)}.btn:disabled{opacity:.5;cursor:wait}
.small{font-size:.9rem;margin-top:14px}.err{color:#8A2A1B;font-weight:700;margin-top:14px}
.stage{border-top:1px solid var(--ink);padding:18px 0}.stage ul,ul.plain{margin:8px 0 0 20px;color:var(--soft)}
.meta{font-size:.92rem;color:var(--soft);margin-top:6px}
footer{margin:80px 0 40px;font-size:.9rem;color:var(--soft)}
select,input[type=email],input[type=tel]{width:100%;max-width:420px;padding:12px 14px;font:inherit;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:2px}
input[type=text]{max-width:420px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);padding:14px 16px;margin-bottom:10px;cursor:pointer;border-radius:2px}
.opt b{display:block}.opt span{font-size:.92rem;color:var(--soft)}.opt.sel{border-color:var(--ink);background:var(--cream-2)}
.navb{display:flex;gap:10px;flex-wrap:wrap}.btn.alt{background:transparent;color:var(--ink)}.btn.alt:hover{background:var(--ink);color:var(--cream)}
.sum{border:2px solid var(--ink);padding:14px 18px;margin:16px 0}.ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}.ln:last-child{border:0;font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:20px}.chk input{width:20px;height:20px;margin-top:4px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="logo" href="index.html">something.co</a><a href="index.html#contact">Contact</a></div></header>
<main class="wrap">

<section id="form"><div id="wiz"></div><p class="err" id="msg" role="alert"></p></section>

<section id="result" hidden>
  <h1 id="r-title">Preparing your plan...</h1>
  <p id="r-status">This takes around 20 to 40 seconds. Please keep this page open.</p>
  <div id="r-body"></div>
</section>

<footer>&copy; Dan Smart, something.co. Perth, Australia.</footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const safeJson=async r=>{const t=await r.text();try{return JSON.parse(t)}catch{return{error:'Server error ('+r.status+'). The function may not be deployed or set up yet.'}}};
const msg=t=>$('#msg').textContent=t;
const params=new URLSearchParams(location.search);
const sid=params.get('session_id');
const freeId=params.get('free');

const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={i:0,idea:{stage:'Just an idea'},type:'',fu:'',edit:'',cap:'10',c:{},news:false,promo:''};
const W=$('#wiz');
const steps=()=>{const q=['idea','type'];if(S.type==='dash')q.push('fu','edit');return q.concat('price','who')};
const quote=()=>{if(S.type==='pdf')return{n:'PDF plan',up:5,mo:0};const f=S.fu==='some'||S.fu==='lots',e=S.edit==='yes',mo=f&&e?25:f?20:e?10:0;return{n:f&&e?'Premium':f?'Dashboard with follow-ups':e?'Dashboard with step editing':'Dashboard',up:20,mo,f}};
const opts=(k,a)=>a.map(o=>`<button type="button" class="opt${S[k]===o[0]?' sel':''}" data-k="${k}" data-v="${o[0]}"><b>${o[1]}</b><span>${o[2]}</span></button>`).join('');
const nav=(ok,l)=>`<div class="navb">${S.i?'<button type="button" class="btn alt" id="bk">Back</button>':''}<button type="button" class="btn" id="nx"${ok?'':' disabled'}>${l||'Continue'}</button></div>`;
function draw(){
 const k=steps()[S.i],I=S.idea,q=quote(),C=S.c;let h='';
 if(k==='idea')h=`<h1>Tell us about your idea.</h1><p>Rough is fine. A couple of sentences will do.</p><label for="n">Name of your idea or startup</label><input id="n" type="text" maxlength="120" value="${esc(I.name)}"><label for="d">What is it, who is it for, and what problem does it solve?</label><textarea id="d" maxlength="2000">${esc(I.idea)}</textarea><label for="st">Where are you at?</label><select id="st">${['Just an idea','Researching it','Building something','Already launched'].map(x=>`<option${I.stage===x?' selected':''}>${x}</option>`).join('')}</select><label for="sk">Where are you stuck? (optional)</label><textarea id="sk" maxlength="500" style="min-height:90px">${esc(I.stuck)}</textarea>${nav(1)}`;
 if(k==='type')h=`<h1>What would you like to walk away with?</h1>`+opts('type',[['pdf','A plan to keep','Your full plan as a PDF.'],['dash','A plan to work through','An interactive dashboard: tick off steps and dig into the detail.']])+nav(S.type);
 if(k==='fu')h=`<h1>Will you want to ask follow-up questions?</h1><p>For example, "How do I find five people to interview?" on any step.</p>`+opts('fu',[['none','Probably not','I can add this later.'],['some','Now and then','A few as I go.'],['lots','Yes, regularly','Help at every step.']])+nav(S.fu);
 if(k==='edit')h=`<h1>Do you want to edit the steps in your plan?</h1><p>Rename, add or remove steps as your idea changes.</p>`+opts('edit',[['yes','Yes, I want to shape it','Edit any step.'],['no','No, keep it as generated','View and tick off only.']])+nav(S.edit);
 if(k==='price'){h=`<h1>We suggest: ${q.n}</h1><div class="sum"><div class="ln"><span>${S.type==='pdf'?'Your plan as a PDF':'One-off access fee'}</span><span>A$${q.up}</span></div>${q.mo?`<div class="ln"><span>Monthly</span><span>A$${q.mo}/month</span></div>`:''}${q.f?'<div class="ln"><span>Follow-up questions</span><span>30 a month included, then A$0.50 each</span></div>':''}<div class="ln"><span>Due today</span><span>A$${q.up+q.mo}</span></div></div>`;
  if(q.f)h+=`<label>Monthly limit on extra questions</label>`+opts('cap',[['0','Stop at 30','No extra charges.'],['10','Up to A$10 extra a month','About 20 extra questions.'],['25','Up to A$25 extra a month','About 50 extra questions.']]);
  h+=nav(1,'Looks good')}
 if(k==='who')h=`<h1>Where should we send your invoice?</h1><p>Stripe will ask for your billing address and an ABN or tax ID (optional) on the next page.</p><label for="cn">Full name</label><input id="cn" type="text" autocomplete="name" value="${esc(C.name)}"><label for="ce">Email</label><input id="ce" type="email" autocomplete="email" value="${esc(C.email)}"><label for="cb">Business name (optional)</label><input id="cb" type="text" value="${esc(C.biz)}"><label for="cp">Phone (optional)</label><input id="cp" type="tel" value="${esc(C.phone)}"><label class="chk"><input type="checkbox" id="nw"${S.news?' checked':''}><span>Send me newsletters and updates from something.co. Unsubscribe any time.</span></label><label for="pr">Promo code (optional)</label><input id="pr" type="text" autocomplete="off" value="${esc(S.promo)}"><p class="small">Card details are entered on Stripe's secure page. something.co never sees your card.</p>${nav(1,'Continue to secure payment')}`;
 W.innerHTML=h;window.scrollTo(0,0);
}
W.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.k){S[b.dataset.k]=b.dataset.v;draw()}else if(b.id==='bk'){S.i--;draw()}else if(b.id==='nx')next()});
W.addEventListener('input',e=>{const t=e.target,m={n:['idea','name'],d:['idea','idea'],st:['idea','stage'],sk:['idea','stuck'],cn:['c','name'],ce:['c','email'],cp:['c','phone'],cb:['c','biz']}[t.id];
 if(m)S[m[0]][m[1]]=t.value;if(t.id==='pr')S.promo=t.value;if(t.id==='nw')S.news=t.checked});
function next(){const k=steps()[S.i];msg('');
 if(k==='idea'&&(!(S.idea.name||'').trim()||(S.idea.idea||'').trim().length<30)){msg('Please add a name and describe your idea in at least a couple of sentences.');return}
 if(k==='who'){if(!(S.c.name||'').trim()||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.c.email||'')){msg('Please enter your name and a valid email.');return}pay();return}
 S.i++;draw()}
async function pay(){$('#nx').disabled=true;
 try{const r=await fetch('/.netlify/functions/create-checkout',{method:'POST',body:JSON.stringify({idea:S.idea,type:S.type,fu:S.fu,edit:S.edit,cap:S.cap,contact:S.c,news:S.news,promo:S.promo})});
  const d=await safeJson(r);if(!r.ok||!d.url)throw new Error(d.error||'Something went wrong.');location.href=d.url}
 catch(e){msg(e.message);$('#nx').disabled=false}}

if(params.get('cancelled'))msg('Payment cancelled. You have not been charged.');
if(sid||freeId){$('#form').hidden=true;$('#result').hidden=false;load()}else draw();

async function load(){
  try{
    const r=await fetch('/.netlify/functions/get-plan?'+(freeId?'free='+encodeURIComponent(freeId):'session_id='+encodeURIComponent(sid)));
    const p=await safeJson(r);
    if(!r.ok)throw new Error(p.error||'Something went wrong.');
    if(p.token){location.replace('app.html?t='+p.token);return}render(p.plan);
  }catch(e){
    $('#r-title').textContent='We hit a problem';
    $('#r-status').textContent=e.message+' If you were charged, refresh this page and your plan will be generated, or email dan.somethingco@gmail.com.';
  }
}

const el=(t,txt,c)=>{const n=document.createElement(t);if(txt)n.textContent=txt;if(c)n.className=c;return n};
const list=(items,c)=>{const u=el('ul','',c||'');(items||[]).forEach(i=>u.append(el('li',i)));return u};

function render(p){
  $('#r-title').textContent=p.title||'Your startup plan';
  $('#r-status').textContent='';
  const b=$('#r-body');
  const dl=el('button','Download PDF','btn');dl.onclick=()=>makePdf(p);b.append(dl);
  b.append(el('h2','Summary'),el('p',p.summary),el('h2','Assessment'),el('p',p.verdict));
  b.append(el('h3','Strengths'),list(p.strengths,'plain'),el('h3','Risks'),list(p.risks,'plain'));
  b.append(el('h2','Idea to MVP: stages'));
  (p.phases||[]).forEach((s,i)=>{
    const d=el('div','','stage');
    d.append(el('h3',`Phase ${i+1}: ${s.name}`),el('p',s.goal),list((s.steps||[]).map(x=>x.title+': '+x.summary)));
    b.append(d);
  });
  b.append(el('h2','Your first 30 days'),list(p.first_30_days,'plain'),el('h2','Next step'),el('p',p.next_step));
  const call=el('p','Want help turning this into reality? Book a free 1 hour discovery workshop at dan.somethingco@gmail.com.');call.style.marginTop='24px';b.append(call);
}

function makePdf(p){
  const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  let y=20;const W=170;
  const add=(t,size=11,bold=false,gap=2)=>{
    d.setFont('helvetica',bold?'bold':'normal');d.setFontSize(size);
    d.splitTextToSize(String(t||''),W).forEach(l=>{if(y>278){d.addPage();y=20}d.text(l,20,y);y+=size*0.42+1.8});
    y+=gap;
  };
  const bullets=a=>(a||[]).forEach(i=>add('- '+i,11,false,0));
  add('something.co  |  Startup idea assessment',9,false,6);
  add(p.title,20,true,4);
  add('Summary',13,true,1);add(p.summary,11,false,4);
  add('Assessment',13,true,1);add(p.verdict,11,false,3);
  add('Strengths',12,true,1);bullets(p.strengths);y+=3;
  add('Risks',12,true,1);bullets(p.risks);y+=5;
  add('Idea to MVP: stages',15,true,3);
  (p.phases||[]).forEach((s,i)=>{
    add(`Phase ${i+1}: ${s.name}`,12,true,1);add(s.goal,11,false,1);bullets((s.steps||[]).map(x=>x.title+': '+x.summary));y+=4;
  });
  add('Your first 30 days',15,true,2);bullets(p.first_30_days);y+=5;
  add('Next step',13,true,1);add(p.next_step,11,false,6);
  add('Free 1 hour discovery workshop: dan.somethingco@gmail.com  |  +61 424 383 329',10,true,4);
  add('This plan is AI-generated guidance and is not professional, legal or financial advice.',8);
  d.save('startup-idea-plan.pdf');
}
</script>
</body>
</html>
